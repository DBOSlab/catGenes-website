<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace">
  <title>ITS partition with bracketed accession identifiers</title>
  <desc>ITS partition of a concatenated matrix where taxa contributing data through a different accession than the reference sequence keep their GenBank or collector identifier as a bracketed comment right next to the tip label, before the sequence data, for example AF467022 or Hernandez9407 GQ250075.</desc>

