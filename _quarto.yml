project:
  output-dir: docs
  type: website
  resources:
    - figures/**

website:
  title: "catGenes"
  site-url: https://dboslab.github.io/catGenes-website/
  page-navigation: true
  reader-mode: true  
  favicon: "figures/catGenes_hex_sticker.png"
  
  page-footer:
    center:
      - text: "About"
        href: about.qmd
      - text: "FAQ"
        href: faq/index.qmd
      - text: "License"
        href: LICENSE.md
    right:
      - icon: github
        href: https://github.com/DBOSlab/catGenes
        aria-label: refloraR GitHub
  
  navbar:
    search: true
    background: light
    collapse-below: lg
    type: light
    logo: "figures/catGenes_hex_sticker.png"
    href: index.qmd
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Get Started"
        href: get-started/index.qmd
      - text: "Articles"
        href: articles/index.qmd
      - text: "News"
        href: news/index.qmd 
      - text: "Reference"
        href: reference/index.qmd
      - text: "Authors"
        href: authors/index.qmd
      - text: "Help"
        menu:
          - text: "Report a Bug"
            icon: "bug"
            href: "https://github.com/DBOSlab/catGenes/issues"
          - text: "Ask a Question"
            icon: "chat-right-text"
            href: "https://github.com/DBOSlab/catGenes/discussions"
          - text: "FAQ"
            icon: "question-circle"
            href: faq/index.qmd
        
    tools:
      - icon: github
        href: https://github.com/DBOSlab/catGenes
        text: catGenes GitHub
        
  sidebar:                
    - id: articles
      title: Articles
      collapse-level: 3
      align: left
      contents:
        - text: Overview
          href: articles/index.qmd
        - section: Input preparation
          contents:
            - text: Standardizing DNA alignments for `catGenes`
              href: articles/standardizing_alignments.qmd
            - text: Loading multiple alignments into R
              href: articles/loading_alignments.qmd
            - text: Working with duplicated taxa and multiple accessions
              href: articles/duplicated_taxa_and_accessions.qmd
        - section: Sequence retrieval and preprocessing
          contents:
            - text: Retrieve sequences from GenBank with accession numbers
              href: articles/retrieve_sequences_by_accession.qmd
            - text: Retrieve sequences from GenBank with taxonomic queries
              href: articles/retrieve_sequences_by_taxon.qmd
            - text: Mine loci from plastomes and mitochondrial genomes
              href: articles/mine_organellar_loci.qmd
        - section: Alignment and concatenation workflows
          contents:
            - text: Combine FASTA files and align sequences
              href: articles/combine_and_align_sequences.qmd
            - text: Convert among FASTA, NEXUS, and PHYLIP
              href: articles/convert_alignment_formats.qmd
            - text: Concatenate multilocus datasets with `catfullGenes()`
              href: articles/concatenate_with_catfullGenes.qmd
            - text: Concatenate datasets with duplicated accessions using `catmultGenes()`
              href: articles/concatenate_with_catmultGenes.qmd
            - text: Remove redundant accessions with `dropSeq()`
              href: articles/remove_redundant_accessions.qmd
        - section: Export, analysis, and visualization
          contents:
            - text: Write concatenated datasets
              href: articles/write_concatenated_datasets.qmd
            - text: Model selection and MrBayes preparation with `evomodelTest()`
              href: articles/model_selection_and_mrbayes.qmd
            - text: Run MrBayes from R
              href: articles/run_mrbayes.qmd
            - text: Plot and edit phylogenetic trees with `plotPhylo()`
              href: articles/plot_phylogenetic_trees.qmd

format:
  html:
    toc: true
    embed-resources: true
    code-copy: true
    code-overflow: wrap
    code-tools: true
    css: styles.css
    eval: false
    theme:
      light: [spacelab, theme.scss]
      dark: [spacelab, theme-dark.scss]
    include-in-header: gtm-head.html
    include-before-body: gtm-body.html
