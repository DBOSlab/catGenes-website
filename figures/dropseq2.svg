<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace">
  <title>After dropSeq(): one accession retained per species</title>
  <desc>Same dataset after dropSeq(), now with 46 taxa. For each species that had duplicated accessions, only the most complete accession is retained, for example Brongniartia_abbottiae_Dorado4988 (real sequence data), while Brongniartia_abbottiae_Dorado1741 (all missing data) was dropped.</desc>

  <rect x="0" y="0" width="900" height="460" rx="12" fill="#ffffff" stroke="#F2A3A8" stroke-width="1.3"/>
  <rect x="0" y="0" width="900" height="36" rx="12" fill="#F9E3E5"/>
  <rect x="0" y="24" width="900" height="12" fill="#F9E3E5"/>
  <circle cx="22" cy="18" r="5" fill="#B85C63"/>
  <text x="38" y="23" font-size="12.5" fill="#1A1A1A">Brongniartia_interleave_missingdata_oneaccession.nex</text>
  <text x="700" y="23" font-size="12.5" font-weight="700" fill="#3C8A5A">AFTER — NTAX=46</text>

  <g font-size="12.5" fill="#1A1A1A">
    <text x="20" y="58" fill="#B85C63" font-weight="700">[ETS]</text>

    <rect x="14" y="66" width="872" height="24" rx="6" fill="#3C8A5A" fill-opacity="0.12"/>
    <text x="20" y="82">Brongniartia_abbottiae_Dorado4988</text>
    <text x="330" y="82" fill="#B85C63">GAGACAAGCATATGACTACTGGCAGGATCAACCAGGT …</text>

    <text x="20" y="112">Brongniartia_aff_bicornuta_Delgado1781</text>
    <text x="20" y="134">Brongniartia_aff_vicioides</text>

    <rect x="14" y="142" width="872" height="24" rx="6" fill="#3C8A5A" fill-opacity="0.12"/>
    <text x="20" y="158">Brongniartia_alamosana_Lott2242</text>
    <text x="330" y="158" fill="#B9A7A9">?????????????????????????????????????</text>

    <text x="20" y="188">Brongniartia_argyrophylla_Tenorio16051</text>
    <text x="330" y="188" fill="#B85C63">GAGACAAGCATATGACTACTGGCAGGATCAACCAGGT …</text>

    <text x="20" y="210">Brongniartia_bicornuta_Dorado1906</text>
    <text x="330" y="210" fill="#B85C63">GAGACAAGCATATGACTACTGGCAGGATCAACCAGGT …</text>

    <text x="20" y="232">Brongniartia_bracteolata</text>
    <text x="20" y="254">Brongniartia_diffusa</text>
    <text x="20" y="276">Brongniartia_foliolosa</text>
    <text x="20" y="298">Brongniartia_funiculata</text>

    <text x="20" y="320">Brongniartia_goldmanii_Tenorio8290</text>
    <text x="330" y="320" fill="#B85C63">GAGACAAGCATATGACTACTGGCAGGATCAACCAGGT …</text>

    <text x="20" y="342">Brongniartia_guerrerensis</text>
    <text x="330" y="342" fill="#86293F" font-weight="700">[Contrens1638]</text>

    <text x="20" y="372" font-style="italic" fill="#8a7375">… 34 more taxa, one accession each</text>

    <rect x="14" y="388" width="16" height="16" rx="3" fill="#3C8A5A" fill-opacity="0.3"/>
    <text x="38" y="401" font-size="11.5" fill="#8a7375">most complete accession retained per species</text>
  </g>
</svg>
