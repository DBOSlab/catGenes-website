<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace">
  <title>Beginning of a NEXUS-formatted concatenated matrix</title>
  <desc>NEXUS header, dimensions, and matrix block showing the ETS partition, with missing-data taxa shown as question marks and taxa with real sequence data truncated for legibility.</desc>

  <rect x="0" y="0" width="900" height="460" rx="12" fill="#ffffff" stroke="#F2A3A8" stroke-width="1.3"/>
  <rect x="0" y="0" width="900" height="36" rx="12" fill="#F9E3E5"/>
  <rect x="0" y="24" width="900" height="12" fill="#F9E3E5"/>
  <circle cx="22" cy="18" r="5" fill="#B85C63"/>
  <text x="38" y="23" font-size="12.5" fill="#1A1A1A">concatenated_dataset.nex</text>

  <g font-size="12.5" fill="#1A1A1A">
